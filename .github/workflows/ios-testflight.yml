name: iOS · TestFlight

# Compila el .ipa en un runner de macOS y lo sube a TestFlight.
#
# Existe porque el desarrollo se hace en Windows y no hay ningun Mac a mano:
# sin esto no se puede generar un build de iOS. Los runners de macOS son
# gratuitos en repositorios publicos como este.
#
# Solo se lanza a mano (workflow_dispatch). No se dispara en push ni en pull
# request a proposito: cada ejecucion consume una version en TestFlight y usa
# los secretos de la cuenta de Apple, que no deben quedar al alcance de un pull
# request de un fork.

on:
  workflow_dispatch:
    inputs:
      tipo_de_build:
        description: 'testflight = para probar via TestFlight | adhoc = .ipa instalable directamente en los dispositivos registrados'
        type: choice
        required: true
        default: testflight
        options:
          - testflight
          - adhoc
      build_number:
        description: 'Numero de build. Para TestFlight DEBE ser mayor que el ultimo subido. Vacio = usa el de pubspec.yaml'
        required: false
        default: ''
      subir_a_testflight:
        description: 'Subir a TestFlight al terminar (se ignora si el tipo es adhoc)'
        type: boolean
        required: false
        default: true

# Dos ejecuciones a la vez subirian dos veces el mismo numero de build.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    # macos-26, no macos-15: Apple rechaza en App Store Connect cualquier app
    # compilada con un SDK anterior al de iOS 26 —"This app was built with the
    # iOS 18.5 SDK... must be built with the iOS 26 SDK or later"—, y macos-15
    # trae Xcode 16.4. El .ipa se generaba y se firmaba bien; lo rechazaba la
    # validacion al subirlo.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Version de Xcode y SDK
        # Sale primero en el log: si Apple vuelve a subir el minimo, aqui se ve
        # de un vistazo con que se esta compilando.
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijada a proposito: 'stable' cambiaria bajo los pies y un build que
          # funciona hoy fallaria manana sin que nadie tocara el codigo.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Analisis estatico y tests
        # Si el codigo no pasa esto, no tiene sentido gastar 20 minutos de
        # compilacion ni ocupar un numero de build en TestFlight.
        #
        # --no-fatal-infos: los errores y los warnings SI tumban el build, que es
        # la barrera que interesa. Los 48 avisos de nivel info que arrastra el
        # proyecto son de estilo —BuildContext tras await, prints sueltos— y
        # bloquear por ellos convertiria el workflow en algo que nadie puede
        # usar hasta limpiarlos todos.
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Instalar la clave de App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_PRIVATE_KEY" ]; then
            echo "Faltan los secretos APPSTORE_KEY_ID y/o APPSTORE_PRIVATE_KEY."
            echo "Ver la seccion 'Compilar iOS sin un Mac' de DESPLIEGUE.md."
            exit 1
          fi
          mkdir -p ~/private_keys
          # El nombre del archivo importa: xcodebuild busca AuthKey_<KEYID>.p8
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Compilar sin firmar
        # Genera Generated.xcconfig, el Flutter.framework y los Pods. La firma
        # se hace en el paso siguiente, donde si hay credenciales.
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            flutter build ios --release --no-codesign --build-number=${{ github.event.inputs.build_number }}
          else
            flutter build ios --release --no-codesign
          fi

      - name: Importar el certificado de distribucion
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        # Xcode NO puede crear un certificado de distribucion con una clave de
        # API: Apple lo prohibe (403 "not allowed to perform this operation"),
        # incluso con rol Admin. Solo se crea desde el portal web. Por eso el
        # certificado se genera una vez a mano y viaja aqui como secreto.
        #
        # Sin esto, el paso de exportar falla con "No signing certificate
        # 'iOS Distribution' found" aunque el archive haya funcionado.
        run: |
          set -euo pipefail
          LLAVERO="$RUNNER_TEMP/firma.keychain-db"
          CLAVE_LLAVERO=$(uuidgen)

          security create-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          # Sin timeout no se bloquea a mitad de una compilacion larga.
          security set-keychain-settings -lut 21600 "$LLAVERO"
          security unlock-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"

          # Se recortan saltos de linea y retornos de carro de los dos secretos.
          # Si el secreto se cargo desde un archivo, casi seguro trae un \n
          # final, y entonces `security import` falla con "MAC verification
          # failed during PKCS12 import (wrong password?)", que hace pensar en
          # una contrasena equivocada cuando en realidad sobra un byte.
          CLAVE_P12=$(printf '%s' "$APPLE_DIST_CERT_PASSWORD" | tr -d '\r\n')
          printf '%s' "$APPLE_DIST_CERT_P12" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security import "$RUNNER_TEMP/dist.p12" -k "$LLAVERO" \
            -P "$CLAVE_P12" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          # Sin esto, codesign pediria confirmacion interactiva y se quedaria
          # colgado hasta agotar el tiempo del job.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CLAVE_LLAVERO" "$LLAVERO" >/dev/null

          # El llavero nuevo debe estar en la lista de busqueda, o xcodebuild no
          # lo mira.
          security list-keychain -d user -s "$LLAVERO" login.keychain-db

          echo "identidades de firma disponibles:"
          security find-identity -v -p codesigning "$LLAVERO"

      - name: Instalar el provisioning profile
        env:
          # Cada tipo de build usa SU perfil: el de App Store no sirve para
          # instalar en un telefono y el ad-hoc no se puede subir a App Store
          # Connect. Se elige aqui segun lo pedido.
          APPLE_PROVISIONING_PROFILE: ${{ github.event.inputs.tipo_de_build == 'adhoc' && secrets.APPLE_PROVISIONING_PROFILE_ADHOC || secrets.APPLE_PROVISIONING_PROFILE }}
        # Igual que el certificado: Apple tampoco deja crear perfiles de
        # distribucion con una clave de API (403), asi que el perfil se crea una
        # vez en el portal y viaja como secreto. Xcode los busca en esta carpeta
        # exacta.
        run: |
          set -euo pipefail
          if [ -z "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "Falta el secreto del provisioning profile para el tipo '${{ github.event.inputs.tipo_de_build }}'."
            echo "  testflight -> APPLE_PROVISIONING_PROFILE"
            echo "  adhoc      -> APPLE_PROVISIONING_PROFILE_ADHOC"
            echo "Ver 'Compilar iOS sin un Mac' en DESPLIEGUE.md."
            exit 1
          fi
          DESTINO="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DESTINO"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | tr -d '\r\n' | base64 --decode > "$DESTINO/legacy_appstore.mobileprovision"

          # El UUID y el nombre confirman que llego el perfil correcto: si no
          # coincide con el de ExportOptions.plist, el export falla sin decir
          # cual esperaba.
          /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$DESTINO/legacy_appstore.mobileprovision")" || true
          /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$DESTINO/legacy_appstore.mobileprovision")" || true

      - name: Archivar y exportar el IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        working-directory: ios
        run: |
          set -euo pipefail
          CLAVE="$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          # El archive NO lleva ajustes de firma en la linea de comandos.
          #
          # Se intento pasar CODE_SIGN_STYLE=Manual y PROVISIONING_PROFILE_
          # SPECIFIER aqui, y xcodebuild los aplica a TODOS los targets, tambien
          # a los Swift Packages de Firebase, GoogleSignIn y AppAuth, que no
          # admiten perfiles: "does not support provisioning profiles, but
          # provisioning profile Legacy App Store CI has been manually
          # specified". El archive fallaba entero.
          #
          # Quien firma de verdad para App Store es exportArchive, y ahi si se
          # indica el perfil, en ExportOptions.plist, que solo afecta a la app.
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CLAVE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

          # El fichero de opciones decide el tipo de .ipa que sale: uno para
          # App Store y otro instalable en los dispositivos del perfil ad-hoc.
          OPCIONES=ExportOptions.plist
          if [ "${{ github.event.inputs.tipo_de_build }}" = "adhoc" ]; then
            OPCIONES=ExportOptionsAdHoc.plist
          fi
          echo "exportando con $OPCIONES"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$OPCIONES" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CLAVE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

          ls -la "$RUNNER_TEMP/ipa"

          # El .ipa NO se llama Runner.ipa: toma el nombre del producto, que
          # aqui es legacy_app.ipa. Se descubre en vez de darlo por supuesto,
          # para que un cambio de nombre no vuelva a romper la subida.
          RUTA_IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          echo "RUTA_IPA=$RUTA_IPA" >> "$GITHUB_ENV"
          echo "ipa generado: $RUTA_IPA"

      - name: Guardar el IPA como artefacto
        # Queda descargable desde la pagina de la ejecucion aunque la subida
        # falle, para no perder 20 minutos de compilacion.
        uses: actions/upload-artifact@v4
        with:
          # El nombre distingue los dos productos: confundirlos cuesta un rato
          # de desconcierto, porque el de app-store no instala en un telefono.
          name: legacy-ios-${{ github.event.inputs.tipo_de_build }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Subir a TestFlight
        # Nunca en ad-hoc: App Store Connect rechaza un .ipa firmado asi.
        if: ${{ github.event.inputs.tipo_de_build != 'adhoc' && github.event.inputs.subir_a_testflight != 'false' }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.RUTA_IPA }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Recoger los registros si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-xcodebuild
          path: |
            ~/Library/Logs/gym
            ${{ runner.temp }}/Runner.xcarchive/Info.plist
          retention-days: 7
          if-no-files-found: ignore
